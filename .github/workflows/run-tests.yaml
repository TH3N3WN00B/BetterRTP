name: Maven Tests

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 21
        uses: actions/setup-java@v1
        with:
          java-version: 21

      - name: Configure Maven settings
        run: cp settings.xml $HOME/.m2/settings.xml

      - name: Build and test with Maven
        run: mvn test
